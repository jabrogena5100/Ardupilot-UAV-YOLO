# ============================================
#  Swarm Fire Test (4 drones + FireSim + Fog)
#  Launch with:
#     python3 launch_experiment.py --config config/exp_swarm_fire.yaml
# ============================================

experiment_tag: fire-quad-demo

# ------------------ ORIGIN & MAP ------------------
origin:
  lat: 21.2970
  lon: -157.8170
geofence_miles: 1.0

grid:
  miles: 1.0
  auto_cell_m: 100                  # optional: launcher computes grid.cells ≈ side/auto_cell_m
  cells: 10
  traverse_frac: 0.8
  # map_radius_m: 20
  # cell_complete_frac: 0.2

# ------------------ COMMUNICATION ------------------
comms:
  group: 239.255.0.1
  port: 5005
  comm_grid_radius: 2

# ------------------ TIMING CONTROL ------------------
timing:
  end_when: time
  max_seconds: 1800

# ------------------ FOG TRACKER ------------------
fog_tracker:
  enable: true
  tick_rate_hz: 2
  max_seconds: 1800
  end_when: visited
  viz_port: 8080                       # 0=off; set e.g. 8080 to serve HTML/JSON (headless grid view)

# ------------------ FIRE MODEL ------------------
fire_model:
  enabled: true
  neighborhood: "von_neumann"   # 4-way spread; use "moore" for 8-way
  p_ignite: 0.05                 # slower spread
  burn_steps: 30                 # burn lasts a few minutes at dt=1s
  burn_time_dist: "normal"       # "fixed" | "uniform" | "normal"
  burn_steps_min: 20
  burn_steps_max: 40
  burn_steps_sigma: 1.5
  dt_seconds: 1.0
  initial_ignitions:
    - [4, 5]
    - [5, 5]
  wind_direction_deg: 0
  wind_strength: 0.0
  random_seed: 42

# ------------------ VEHICLE DEFAULTS ------------------
vehicle_defaults:
  alt: 25
  vxy_max: 8
  vz_max: 1.5
  axy_max: 2
  az_max: 1
  rate_hz: 10

# ------------------ AGENTS (4 drones, quadrant partition) ------------------
agents:
  - name: A
    conn: udp:127.0.0.1:14555
    mission: grid_frontier
    strategy_tag: coop
    comm_mode: full
    seed: 1
    partition: {scheme: quadrants, n: 4, id: 0}

  - name: B
    conn: udp:127.0.0.1:14556
    mission: grid_frontier
    strategy_tag: coop
    comm_mode: full
    seed: 2
    partition: {scheme: quadrants, n: 4, id: 1}

  - name: C
    conn: udp:127.0.0.1:14557
    mission: grid_frontier
    strategy_tag: coop
    comm_mode: full
    seed: 3
    partition: {scheme: quadrants, n: 4, id: 2}

  - name: D
    conn: udp:127.0.0.1:14558
    mission: grid_frontier
    strategy_tag: coop
    comm_mode: full
    seed: 4
    partition: {scheme: quadrants, n: 4, id: 3}
