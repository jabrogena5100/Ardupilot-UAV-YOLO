# Boreal v2 Level 2 evaluation config for eval/run_matrix.py (separate from eval/datasets.yaml, which is the Boreal v1 baseline).
# ${BOREAL_V2_SPLIT}=/workspace/splits/boreal_v2  ${SYNTH_ROOT}=/workspace/synth_smoke_v1  ${RUNS}=/workspace/runs
# Model A checkpoints are the existing, pinned v1 checkpoints (synthetic training data is unaffected by the Boreal split).
# Model B v2 checkpoints (model_bv2*) have sha256 null here; the pod job writes a pinned copy after training (hash of the file it just produced).
# Boreal v1 results are NOT directly comparable with Boreal v2 results (different train and test populations).
settings:
  imgsz: 640
  conf: 0.001
  nms_iou: 0.7
  max_det: 300
  batch: 32
  seed: 0
  report_conf:
  - 0.25
datasets:
  boreal_v2_test:
    domain: real
    images_dir: ${BOREAL_V2_SPLIT}/images/test
    n_images: 744
    filelist_sha256: 9fa6dbc1d0eb9fa437e989be29afadc9a459f7850502f1c18c350379afcddc8f
    cluster: clip
    note: Boreal v2 clip-disjoint test split (8 source clips). Clustered bootstrap resamples source clips (Empty-Images frames join their clip).
      Contains 65 true-negative (Empty-Images) frames and 0 unlabeled non-Empty frames.
  boreal_v2_test_pos:
    domain: real
    images_dir: ${BOREAL_V2_SPLIT}/images/test
    only_positive: true
    n_images: 679
    filelist_sha256: 4b9f511a038efbea7846611424fdf548d75a8662e1c6cb3853131581b1b39938
    cluster: clip
    note: Boreal v2 test frames with at least one box (positive-only view; comparable in kind to synth_test_pos).
  boreal_v2_test_neg:
    domain: real
    images_dir: ${BOREAL_V2_SPLIT}/images/test
    name_prefix: Empty-Images__
    n_images: 65
    filelist_sha256: a41da4fb91fdc5bba5027895a2db3121a7ee97b7aa6ada120952dbdcedadf54e
    cluster: clip
    note: Held-out true-negative scenes (Empty-Images frames from the two mixed test clips). Valid empty-scene FP probe for BOTH model families
      (neither trained on these clips).
  synth_test_pos:
    domain: synthetic
    images_dir: ${SYNTH_ROOT}/images/test
    only_positive: true
    n_images: 701
    filelist_sha256: 487ecc6146b2b99be2b396830bbdb88768972f0adfc989c26b4d7da0627b576b
  synth_test_all:
    domain: synthetic
    images_dir: ${SYNTH_ROOT}/images/test
    n_images: 1051
    filelist_sha256: 893d17ed7eb396bb0fe9b1e2026d0f162d0a96b7f3f244c8cde30a8db536dae2
    note: test_pos plus 350 background images; used for the empty-scene false-positive rate.
models:
  model_a:
    train_domain: synthetic
    family: A
    seed: 0
    checkpoint: ${RUNS}/synth_smoke_a_v1/synth_smoke_best_v1.pt
    sha256: 1da10c4814a905d92deec2d9c36185f872eabea447d47c389b9b065468009564
  model_a_seed1:
    train_domain: synthetic
    family: A
    seed: 1
    checkpoint: ${RUNS}/synth_smoke_a_v1_seed1/synth_smoke_best_v1_seed1.pt
    sha256: 31c4528e37c54f779cdbfbf02d8e325877108696f3608391c0490b22ec34a454
  model_a_seed2:
    train_domain: synthetic
    family: A
    seed: 2
    checkpoint: ${RUNS}/synth_smoke_a_v1_seed2/synth_smoke_best_v1_seed2.pt
    sha256: 3d5a31689ab212434b206949090c948a4de0b4b653abf8d0099619529146556a
  model_bv2:
    train_domain: real
    family: B
    seed: 0
    checkpoint: ${RUNS}/boreal_v2/real_boreal_v2_seed0/real_boreal_v2_best_seed0.pt
    sha256: null
  model_bv2_seed1:
    train_domain: real
    family: B
    seed: 1
    checkpoint: ${RUNS}/boreal_v2/real_boreal_v2_seed1/real_boreal_v2_best_seed1.pt
    sha256: null
  model_bv2_seed2:
    train_domain: real
    family: B
    seed: 2
    checkpoint: ${RUNS}/boreal_v2/real_boreal_v2_seed2/real_boreal_v2_best_seed2.pt
    sha256: null
cells:
  models:
  - model_a
  - model_a_seed1
  - model_a_seed2
  - model_bv2
  - model_bv2_seed1
  - model_bv2_seed2
  datasets:
  - boreal_v2_test
  - boreal_v2_test_pos
  - boreal_v2_test_neg
  - synth_test_pos
  - synth_test_all
